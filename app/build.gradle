plugins { id 'com.android.application' }
android {
    namespace 'com.ryzenic.rblx'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ryzenic.rblx'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }   // подписан debug-ключом, чтобы APK ставился сразу
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
